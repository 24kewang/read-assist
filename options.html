<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Read Assist Settings</title>
  <style>
    :root { --bg:#fbfaf7; --surface:#fff; --text:#1f1d1a; --muted:#6b665e; --border:#e6e1d8; --accent:#b23a2b; color-scheme: light; }
    @media (prefers-color-scheme: dark) {
      :root { --bg:#18171a; --surface:#222125; --text:#ece9e3; --muted:#a19c93; --border:#35333a; --accent:#e57361; color-scheme: dark; }
    }
    body { margin:0; background:var(--bg); color:var(--text); font:14px/1.55 system-ui, sans-serif; }
    main { max-width:560px; margin:32px auto; padding:0 16px; }
    h1 { font-size:20px; }
    .field { background:var(--surface); border:1px solid var(--border); border-radius:10px; padding:14px; margin-bottom:12px; }
    label { display:block; font-weight:600; margin-bottom:6px; }
    input[type=text], input[type=password] {
      width:100%; box-sizing:border-box; padding:7px 9px; font:inherit; border-radius:6px;
      border:1px solid var(--border); background:var(--bg); color:var(--text);
    }
    .help { color:var(--muted); font-size:13px; margin:6px 0 0; }
    a { color:var(--accent); }
    .radio { display:flex; gap:16px; }
    .radio label { font-weight:400; display:flex; gap:6px; align-items:center; }
    button { border:0; border-radius:6px; padding:8px 16px; background:var(--accent); color:#fff; font:inherit; font-weight:600; cursor:pointer; }
    #saved { margin-left:10px; color:var(--muted); }
  </style>
</head>
<body>
  <main>
    <h1>读 Read Assist settings</h1>

    <div class="field">
      <label for="apiKey">Gemini API key</label>
      <input id="apiKey" type="password" autocomplete="off" spellcheck="false">
      <p class="help">Get a key at <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">Google AI Studio</a>. It is stored only in this browser and sent only to Google's Gemini API.</p>
    </div>

    <div class="field">
      <label for="model">Model</label>
      <input id="model" type="text" spellcheck="false">
      <p class="help">Any Gemini model id that supports JSON output. Fast "flash" models work best for lookups.</p>
    </div>

    <div class="field">
      <label>Pinyin tones</label>
      <div class="radio">
        <label><input type="radio" name="toneType" value="symbol"> Tone marks (nǐ hǎo)</label>
        <label><input type="radio" name="toneType" value="num"> Numbers (ni3 hao3)</label>
      </div>
    </div>

    <button id="save">Save</button><span id="saved"></span>
  </main>
  <script type="module" src="options.js"></script>
</body>
</html>
