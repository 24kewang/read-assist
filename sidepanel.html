<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Read Assist</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header class="bar">
    <span class="brand">读 Read Assist</span>
    <div id="detail-toggle" class="segmented" role="radiogroup" aria-label="Detail level">
      <button data-detail="simple" aria-checked="false" role="radio" title="Dictionary only: instant, no API calls">Simple</button>
      <button data-detail="detailed" aria-checked="true" role="radio" title="Dictionary plus Gemini explanations">Detailed</button>
    </div>
    <div class="bar-actions">
      <button id="clipboard-btn" class="icon-btn" title="Look up clipboard text (Alt+Shift+L)">📋</button>
      <button id="settings-btn" class="icon-btn" title="Settings">⚙︎</button>
    </div>
  </header>

  <main>
    <section id="empty" class="empty">
      <p class="empty-title">Select Chinese text on the page.</p>
      <p>Pinyin, a simple definition, English and a deeper explanation will appear here.</p>
      <p class="hint">In PDFs and Google Docs, select the text and press <kbd>Ctrl</kbd>+<kbd>C</kbd>.</p>
      <p class="hint">Close this sidebar to turn the extension off.</p>
    </section>

    <section id="view" hidden>
      <div class="selection-card">
        <div id="selection" class="selection" lang="zh"></div>
        <div class="mode-row" id="mode-row">
          <div id="mode-toggle" class="segmented" role="radiogroup" aria-label="Lookup mode">
            <button data-mode="auto" aria-checked="true" role="radio">Auto</button>
            <button data-mode="word" aria-checked="false" role="radio">Word</button>
            <button data-mode="passage" aria-checked="false" role="radio">Passage</button>
          </div>
          <span id="mode-label" class="mode-label"></span>
        </div>
      </div>

      <div id="status" class="status" hidden></div>
      <div id="results"></div>
    </section>
  </main>

  <footer class="manual">
    <textarea id="manual-input" rows="2" placeholder="Or type / paste Chinese here…" lang="zh"></textarea>
    <button id="manual-btn" class="primary">Look up</button>
  </footer>

  <script src="lib/pinyin-pro.js"></script>
  <script type="module" src="sidepanel.js"></script>
</body>
</html>
